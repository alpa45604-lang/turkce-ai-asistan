
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benim Yapay Zekâm</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif}
header{padding:18px;text-align:center;background:#192338;font-size:22px;font-weight:bold}
#chat{height:calc(100dvh - 145px);overflow-y:auto;padding:15px}
.msg{padding:12px 15px;margin:10px 0;border-radius:14px;max-width:90%;white-space:pre-wrap;line-height:1.5}
.user{background:#2458a6;margin-left:auto}
.ai{background:#263247;margin-right:auto}
footer{position:fixed;bottom:0;left:0;width:100%;padding:12px;background:#192338;display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px;border:0;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 18px;background:#3979e8;color:white;font-size:16px}
</style>
</head>
<body>
<header>BENİM YAPAY ZEKÂM</header>
<div id="chat">
<div class="msg ai">Merhaba! Ben senin kişisel yapay zekâ asistanınım. Sana nasıl yardımcı olabilirim?</div>
</div>
<footer>
<input id="message" placeholder="Mesajını yaz..." autocomplete="off">
<button id="send">Gönder</button>
</footer>
<script>
const API="https://benim-yapay-zekam.alpa45604.workers.dev/";
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");
const history=[];

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function ask(){
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 addMessage(text,"user");
 history.push({role:"user",parts:[{text}]});
 send.disabled=true;
 send.textContent="Bekle...";
 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({contents:history})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||data.error||"Bağlantı hatası");
  const answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"Yanıt alınamadı.";
  history.push({role:"model",parts:[{text:answer}]});
  addMessage(answer,"ai");
 }catch(error){
  addMessage("Hata: "+error.message,"ai");
  history.pop();
 }finally{
  send.disabled=false;
  send.textContent="Gönder";
 }
}
send.addEventListener("click",ask);
input.addEventListener("keydown",e=>{if(e.key==="Enter")ask()});
</script>
</body>
</html>
