
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<title>Benim Yapay Zekâm</title>

<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
:root{--bg:#101522;--panel:#192338;--card:#263247;--blue:#3979e8;--text:#f5f7fb;--muted:#aab4c5}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;height:100dvh;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
header{
 height:64px;flex-shrink:0;background:var(--panel);
 display:flex;align-items:center;justify-content:space-between;
 padding:0 15px;border-bottom:1px solid #ffffff12
}
.logo{font-size:18px;font-weight:bold}
.logo span{color:#70a2ff}
.header-actions{display:flex;gap:8px}
.header-actions button,.icon-btn{
 border:0;background:var(--card);color:white;
 border-radius:10px;padding:10px 12px
}
#chat{
 flex:1;overflow-y:auto;padding:18px 14px 25px;
 width:100%;max-width:850px;margin:auto
}
.welcome{text-align:center;margin:12vh auto 30px;max-width:500px}
.welcome .symbol{font-size:48px;margin-bottom:15px}
.welcome h1{font-size:27px;margin:10px 0}
.welcome p{color:var(--muted);line-height:1.6}
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:25px}
.suggestion{
 background:var(--panel);border:1px solid #ffffff15;
 color:white;padding:14px;border-radius:13px;text-align:left
}
.msg{display:flex;margin:18px 0;gap:10px;align-items:flex-start}
.avatar{
 width:32px;height:32px;flex-shrink:0;border-radius:50%;
 display:grid;place-items:center;background:var(--blue);font-size:15px
}
.msg-content{min-width:0;max-width:calc(100% - 42px);line-height:1.65}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:#43536d}
.msg.user .msg-content{
 background:#2458a6;padding:12px 15px;border-radius:16px 4px 16px 16px
}
.msg.ai .msg-content{padding:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-actions{display:flex;gap:8px;margin-top:9px}
.msg-actions button{
 border:0;background:var(--panel);color:var(--muted);
 border-radius:8px;padding:6px 10px;font-size:12px
}
.typing{color:var(--muted);font-size:14px;padding:10px 0}
footer{
 flex-shrink:0;background:var(--panel);padding:12px 14px;
 padding-bottom:max(12px,env(safe-area-inset-bottom));
 border-top:1px solid #ffffff12
}
.composer{max-width:850px;margin:auto}
.input-box{
 background:var(--bg);border:1px solid #ffffff25;
 border-radius:17px;padding:10px;display:flex;align-items:flex-end;gap:8px
}
#message{
 flex:1;min-width:0;max-height:150px;resize:none;
 border:0;outline:0;background:transparent;color:white;
 padding:10px 5px;font-size:16px;line-height:1.5
}
#message::placeholder{color:#8792a5}
.tool-btn{
 border:0;background:var(--card);color:white;
 border-radius:11px;width:42px;height:42px;flex-shrink:0
}
#send{background:var(--blue);font-weight:bold}
#send:disabled{opacity:.5}
.status{text-align:center;color:var(--muted);font-size:11px;margin-top:9px}
#fileInput{display:none}
#attachment{font-size:12px;color:#9fc0ff;margin:5px}
@media(max-width:480px){
 .logo{font-size:16px}
 header{padding:0 10px}
 .welcome{margin-top:9vh}
 .welcome h1{font-size:23px}
 .suggestions{grid-template-columns:1fr}
 #chat{padding:14px 12px}
}
</style>
</head>

<body>
<div class="app">
<header>
 <div class="logo">✦ BENİM <span>YAPAY ZEKÂM</span></div>
 <div class="header-actions">
  <button id="newChat">＋ Yeni sohbet</button>
 </div>
</header>

<main id="chat">
 <section class="welcome" id="welcome">
  <div class="symbol">✦</div>
  <h1>Nasıl yardımcı olabilirim?</h1>
  <p>Benim Yapay Zekâm'a hoş geldin. Bir şey sor, fikir üret, yazı yaz veya birlikte bir şeyler öğrenelim.</p>
  <div class="suggestions">
   <button class="suggestion" data-prompt="Bana yeni bir iş fikri bul.">💡 Yeni bir iş fikri bul</button>
   <button class="suggestion" data-prompt="Bana ilginç bir hikâye anlat.">📖 İlginç bir hikâye anlat</button>
   <button class="suggestion" data-prompt="Bana bir internet sitesi yapmayı öğret.">💻 Kod yazmama yardım et</button>
   <button class="suggestion" data-prompt="Bugün öğrenebileceğim ilginç bir bilgi söyle.">🧠 İlginç bir bilgi öğren</button>
  </div>
 </section>
</main>

<footer>
 <div class="composer">
  <div id="attachment"></div>
  <div class="input-box">
   <button class="tool-btn" id="fileButton" title="Dosya seç">＋</button>
   <input id="fileInput" type="file" accept=".txt,.md,.csv,.json">
   <textarea id="message" rows="1" placeholder="Mesajını yaz..."></textarea>
   <button class="tool-btn" id="mic" title="Sesle yaz">🎙</button>
   <button class="tool-btn" id="send" title="Gönder">➤</button>
  </div>
  <div class="status">Yapay zekâ yanıtları hata içerebilir. Önemli bilgileri kontrol et.</div>
 </div>
</footer>
</div>

<script>
const API="https://benim-yapay-zekam.alpa45604.workers.dev/";

const chat=document.getElementById("chat");
const input=document.getElementById("message");
const send=document.getElementById("send");
const mic=document.getElementById("mic");
const fileInput=document.getElementById("fileInput");
const attachment=document.getElementById("attachment");
const welcome=document.getElementById("welcome");

let history=[];
let selectedFileText="";
let busy=false;

try{
 history=JSON.parse(localStorage.getItem("ai_history")||"[]");
 if(!Array.isArray(history))history=[];
}catch(e){history=[]}

function saveHistory(){
 try{localStorage.setItem("ai_history",JSON.stringify(history.slice(-40)))}catch(e){}
}

function removeWelcome(){
 const w=document.getElementById("welcome");
 if(w)w.remove();
}

function addMessage(text,type){
 removeWelcome();

 const row=document.createElement("div");
 row.className="msg "+type;

 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=type==="user"?"S":"✦";

 const content=document.createElement("div");
 content.className="msg-content";
 content.textContent=text;

 row.append(avatar,content);
 chat.appendChild(row);

 if(type==="ai"){
  const actions=document.createElement("div");
  actions.className="msg-actions";

  const copy=document.createElement("button");
  copy.textContent="📋 Kopyala";
  copy.onclick=()=>{
   navigator.clipboard.writeText(text).then(()=>{
    copy.textContent="Kopyalandı ✓";
   }).catch(()=>alert("Kopyalama desteklenmiyor."));
  };

  const speak=document.createElement("button");
  speak.textContent="🔊 Sesli oku";
  speak.onclick=()=>{
   if(!("speechSynthesis" in window)){
    alert("Bu tarayıcı sesli okumayı desteklemiyor.");return;
   }
   speechSynthesis.cancel();
   const utterance=new SpeechSynthesisUtterance(text);
   utterance.lang="tr-TR";
   speechSynthesis.speak(utterance);
  };

  actions.append(copy,speak);
  content.appendChild(actions);
 }

 chat.appendChild(row);
 chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
 const el=document.createElement("div");
 el.className="typing";
 el.id="typing";
 el.textContent="Yapay zekâ düşünüyor...";
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function hideTyping(){
 const el=document.getElementById("typing");
 if(el)el.remove();
}

async function ask(customText){
 if(busy)return;

 let text=(customText||input.value).trim();
 if(!text && !selectedFileText)return;

 if(selectedFileText){
  text+=(text?"\n\n":"")+"Dosya içeriği:\n"+selectedFileText;
 }

 input.value="";
 input.style.height="auto";
 selectedFileText="";
 attachment.textContent="";

 addMessage(text,"user");
 history.push({role:"user",parts:[{text}]});
 busy=true;
 send.disabled=true;
 showTyping();

 try{
  const response=await fetch(API,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({contents:history.slice(-30)})
  });

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||data.error||"Bağlantı hatası");
  }

  const answer=data.candidates?.[0]?.content?.parts
   ?.map(p=>p.text||"").join("")||"Yanıt alınamadı.";

  history.push({role:"model",parts:[{text:answer}]});
  saveHistory();
  hideTyping();
  addMessage(answer,"ai");

 }catch(error){
  hideTyping();
  history.pop();
  addMessage("Bağlantı hatası: "+error.message,"ai");
 }finally{
  busy=false;
  send.disabled=false;
  input.focus();
 }
}

send.addEventListener("click",()=>ask());

input.addEventListener("input",()=>{
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,150)+"px";
});

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  ask();
 }
});

document.querySelectorAll(".suggestion").forEach(button=>{
 button.addEventListener("click",()=>{
  ask(button.dataset.prompt);
 });
});

document.getElementById("newChat").addEventListener("click",()=>{
 if(busy)return;
 history=[];
 saveHistory();
 chat.innerHTML="";
 chat.appendChild(welcome.cloneNode(true));
 const w=document.getElementById("welcome");
 w.querySelectorAll(".suggestion").forEach(button=>{
  button.addEventListener("click",()=>ask(button.dataset.prompt));
 });
 speechSynthesis?.cancel?.();
});

document.getElementById("fileButton").addEventListener("click",()=>{
 fileInput.click();
});

fileInput.addEventListener("change",async()=>{
 const file=fileInput.files[0];
 if(!file)return;

 if(file.size>500000){
  alert("Şimdilik en fazla 500 KB metin dosyası seçebilirsin.");
  fileInput.value="";
  return;
 }

 try{
  selectedFileText=await file.text();
  attachment.textContent="📎 "+file.name+" eklendi";
 }catch(e){
  alert("Dosya okunamadı.");
 }
});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SpeechRecognition){
 const recognition=new SpeechRecognition();
 recognition.lang="tr-TR";
 recognition.continuous=false;
 recognition.interimResults=false;

 mic.addEventListener("click",()=>{
  try{
   mic.textContent="🔴";
   recognition.start();
  }catch(e){}
 });

 recognition.onresult=e=>{
  input.value+=(input.value?" ":"")+e.results[0][0].transcript;
  input.dispatchEvent(new Event("input"));
 };

 recognition.onend=()=>mic.textContent="🎙";
 recognition.onerror=()=>mic.textContent="🎙";
}else{
 mic.addEventListener("click",()=>{
  alert("Sesle yazma için Android Chrome tarayıcısını kullan.");
 });
}

function restoreMessages(){
 if(history.length===0)return;
 removeWelcome();

 history.forEach(item=>{
  const text=item.parts?.map(p=>p.text||"").join("")||"";
  if(text)addMessage(text,item.role==="user"?"user":"ai");
 });
}

restoreMessages();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}
</script>
</body>
</html>
