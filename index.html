
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benim Yapay Zekâm</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131d;color:white;font-family:Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{padding:18px;background:#1b2030;border-bottom:1px solid #34394b;display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:19px}
button{border:0;border-radius:12px;padding:12px;background:#6957ed;color:white;font-weight:bold}
#chat{flex:1;overflow:auto;padding:16px}
.msg{padding:13px 15px;border-radius:15px;margin:12px 0;max-width:88%;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}
.user{background:#6957ed;margin-left:auto}
.ai{background:#242a3b;margin-right:auto}
footer{display:flex;gap:8px;padding:12px;background:#1b2030}
input{min-width:0;flex:1;padding:14px;border-radius:12px;border:1px solid #454b60;background:#10131d;color:white;font-size:16px}
#settings{padding:15px;background:#242a3b}
small{color:#b9bfd0}
</style>
</head>
<body>
<header>
<h2>🤖 BENİM YAPAY ZEKÂM</h2>
<button onclick="showSettings()">⚙ Ayarlar</button>
</header>

<div id="settings">
<strong>API anahtarı</strong>
<p><small>Google AI Studio anahtarını buraya gir. Anahtar bu oturumda tutulur.</small></p>
<input id="key" type="password" placeholder="API anahtarını gir">
<button onclick="saveKey()">Kaydet</button>
</div>

<main id="chat">
<div class="msg ai">Merhaba! Ben senin kişisel yapay zekâ asistanınım. 😊<br>Bugün sana nasıl yardımcı olabilirim?</div>
</main>

<footer>
<input id="message" placeholder="Bana bir şey sor..." onkeydown="if(event.key==='Enter')send()">
<button id="send" onclick="send()">Gönder</button>
</footer>

<script>
let apiKey=sessionStorage.getItem("gemini_key")||"";
let history=[];

function showSettings(){
document.getElementById("settings").style.display="block";
document.getElementById("key").value=apiKey;
}

function saveKey(){
apiKey=document.getElementById("key").value.trim();
if(!apiKey){alert("API anahtarını gir.");return;}
sessionStorage.setItem("gemini_key",apiKey);
document.getElementById("settings").style.display="none";
alert("Anahtar bu oturum için kaydedildi.");
}

function addMessage(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
document.getElementById("chat").appendChild(div);
div.scrollIntoView({behavior:"smooth"});
return div;
}

async function send(){
const input=document.getElementById("message");
const text=input.value.trim();
if(!text)return;
if(!apiKey){alert("Önce Ayarlar bölümünden API anahtarını gir.");return;}

input.value="";
addMessage(text,"user");
history.push({role:"user",parts:[{text}]});

const loading=addMessage("Düşünüyorum...","ai");
document.getElementById("send").disabled=true;

try{
const response=await fetch(
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+encodeURIComponent(apiKey),
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
system_instruction:{parts:[{text:"Sen Türkçe konuşan, akıllı, samimi ve yardımsever kişisel yapay zekâ asistanısın. Açık ve anlaşılır cevaplar ver."}]},
contents:history
})
});

const data=await response.json();
if(!response.ok)throw new Error(data.error?.message||"Bağlantı hatası");

const answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("\n");
if(!answer)throw new Error("Boş cevap alındı.");

loading.textContent=answer;
history.push({role:"model",parts:[{text:answer}]});

}catch(error){
loading.textContent="Hata: "+error.message;
history.pop();
}finally{
document.getElementById("send").disabled=false;
}
}
</script>
</body>
</html>
